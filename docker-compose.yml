name: "web-sotodelprior"

networks:
  proxy-net:
    external: true

services:
  web-sotodelprior:
    build: .
    container_name: web-sotodelprior
    restart: unless-stopped
    init: true
    environment:
      - DATABASE_URL=file:/app/db/prod.db
      - NEXT_PUBLIC_APP_URL=https://www.sotodelprior.com
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=https://www.sotodelprior.com
      - NEXTAUTH_SECRET=changeme123unused
      # Obrador (fuente de verdad del catálogo y pedidos). Clave de integración
      # del local; se puede rotar desde Obrador → Ajustes → Integración.
      - OBRADOR_API_URL=https://obrador.oteyzerena.com
      - OBRADOR_API_KEY=mUdP1cDdLfEQkb7b9tykP2XZllpqKKWl
    volumes:
      - ./db_data:/app/db
    networks:
      - proxy-net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      # Router HTTPS
      - "traefik.http.routers.web-sotodelprior.rule=Host(`sotodelprior.com`) || Host(`www.sotodelprior.com`)"
      - "traefik.http.routers.web-sotodelprior.entrypoints=websecure"
      # Redirect 301 no-www -> www (la canonica y el sitemap usan www)
      - "traefik.http.middlewares.web-sotodelprior-wwwredir.redirectregex.regex=^https?://sotodelprior\\.com/(.*)"
      - "traefik.http.middlewares.web-sotodelprior-wwwredir.redirectregex.replacement=https://www.sotodelprior.com/$${1}"
      - "traefik.http.middlewares.web-sotodelprior-wwwredir.redirectregex.permanent=true"
      - "traefik.http.routers.web-sotodelprior.middlewares=web-sotodelprior-wwwredir"
      - "traefik.http.routers.web-sotodelprior.tls=true"
      - "traefik.http.routers.web-sotodelprior.tls.certresolver=le"
      # Servicio
      - "traefik.http.services.web-sotodelprior.loadbalancer.server.port=3000"
      # Redirect HTTP -> HTTPS
      - "traefik.http.routers.web-sotodelprior-http.rule=Host(`sotodelprior.com`) || Host(`www.sotodelprior.com`)"
      - "traefik.http.routers.web-sotodelprior-http.entrypoints=web"
      - "traefik.http.routers.web-sotodelprior-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
